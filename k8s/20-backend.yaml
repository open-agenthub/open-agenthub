apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-backend
  namespace: agenthub
spec:
  replicas: 2
  selector:
    matchLabels: { app: agenthub-backend }
  template:
    metadata:
      labels: { app: agenthub-backend }
    spec:
      serviceAccountName: agenthub-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: registry.example.com/agenthub/backend:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: agenthub-config }
            - secretRef:    { name: agenthub-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-backend
  namespace: agenthub
spec:
  selector: { app: agenthub-backend }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthub-config
  namespace: agenthub
data:
  AgentHub__Namespace: "agenthub-sessions"
  # Legacy Claude-only option retained for compatibility with older backends.
  AgentHub__AgentImage: "registry.example.com/agenthub/agent-runtime-claude:latest"
  AgentHub__ClaudeAgentImage: "registry.example.com/agenthub/agent-runtime-claude:latest"
  AgentHub__CodexAgentImage: "registry.example.com/agenthub/agent-runtime-codex:latest"
  AgentHub__CursorAgentImage: "registry.example.com/agenthub/agent-runtime-cursor:latest"
  AgentHub__OpenClawAgentImage: "registry.example.com/agenthub/agent-runtime-openclaw:latest"
  AgentHub__AgentPort: "7681"
  AgentHub__CallbackBaseUrl: "http://agenthub-backend.agenthub.svc.cluster.local"
  Kestrel__Limits__MaxRequestBodySize: "57671680"
  Files__MaxImageBytes: "20971520"
  Files__MaxDocumentBytes: "52428800"
  Files__MaxMessageBytes: "52428800"
  Files__MaxMessageFiles: "5"
  Files__MaxSessionFiles: "200"
  Files__MaxSessionBytes: "1073741824"
  Files__PresignMinutes: "10"
  Files__ReservationMinutes: "15"
  Files__SweepSeconds: "60"
  Files__PresentationPollMilliseconds: "1500"
  Files__OfficePreview__Enabled: "false"
  Files__OfficePreview__BaseUrl: "http://agenthub-artifact-renderer:8080/"
  Files__OfficePreview__TimeoutSeconds: "90"
  Files__OfficePreview__MaxOutputBytes: "52428800"
  Files__OfficePreview__PollMilliseconds: "1000"
  Browser__Enabled: "true"
  Browser__Image: "registry.example.com/agenthub/browser:latest"
  Browser__PullPolicy: "IfNotPresent"
  Browser__ImagePullSecret: ""
  Browser__RuntimeClassName: ""
  Browser__CpuRequest: "250m"
  Browser__MemoryRequest: "512Mi"
  Browser__CpuLimit: "1"
  Browser__MemoryLimit: "2Gi"
  Browser__ScreenWidth: "1440"
  Browser__ScreenHeight: "900"
  Browser__StartupTimeoutSeconds: "90"
  Browser__CookieCheckpointSeconds: "60"
  Browser__CookieStateMaxBytes: "1048576"
  S3__ServiceUrl: ""
  S3__Region: "us-east-1"
  S3__Bucket: "agenthub"
  N8n__WebhookUrl: ""
  Oidc__Authority: ""
  Oidc__Audience: "agenthub"
  FrontendOrigin: "https://agenthub.example.com"
---
# Keep secrets separate. In prod, populate via SealedSecrets/Vault; never commit them in plaintext.
apiVersion: v1
kind: Secret
metadata:
  name: agenthub-secrets
  namespace: agenthub
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres.agenthub.svc.cluster.local;Database=agenthub;Username=agenthub;Password=CHANGE_ME"
  S3__AccessKey: "CHANGE_ME"
  S3__SecretKey: "CHANGE_ME"
---
# Optional Office preview renderer. Set replicas to 1 and
# Files__OfficePreview__Enabled to true to enable it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-artifact-renderer
  namespace: agenthub
spec:
  replicas: 0
  selector:
    matchLabels: { app: agenthub-artifact-renderer }
  template:
    metadata:
      labels: { app: agenthub-artifact-renderer }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: renderer
          image: registry.example.com/agenthub/artifact-renderer:latest
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-artifact-renderer
  namespace: agenthub
spec:
  selector: { app: agenthub-artifact-renderer }
  ports: [{ port: 8080, targetPort: 8080 }]
