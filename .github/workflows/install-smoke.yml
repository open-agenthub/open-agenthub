name: Quickstart install

# Runs the published quickstart (install.sh from open-agenthub.github.io) with the chart
# from this checkout, so a chart change cannot silently break the one-command install.
# The scripts themselves are tested in the open-agenthub.github.io repository.
on:
  pull_request:
    paths: ["backend/**", "ee/backend/**", "helm/**", ".github/workflows/install-smoke.yml", "tests/InstallSmokeProof/**"]
  push:
    branches: [main]
    paths: ["backend/**", "ee/backend/**", "helm/**", ".github/workflows/install-smoke.yml", "tests/InstallSmokeProof/**"]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      prove_provider_switch:
        description: "Prove real CLI provider replacement on a real persistent workspace"
        type: boolean
        default: false
      prove_provider_recovery:
        description: "Crash backend replicas at every saved native replacement phase"
        type: boolean
        default: false
      prove_workspace_pvc:
        description: "Prove persistent session workspace mounts and pause/resume on real kubelet"
        type: boolean
        default: false
      prove_postgres_startup:
        description: "Capture bundled database first-start termination and signal permissions"
        type: boolean
        default: false
      prove_storage_egress:
        description: "Prove session storage egress isolation under real NetworkPolicy"
        type: boolean
        default: false
      prove_backend_private_ca:
        description: "Prove backend TLS trust with a private-CA issuer"
        type: boolean
        default: false
      installer_ref:
        description: "Website revision to test (empty uses the published installer)"
        type: string
        default: ""
      block_k3s_channel:
        description: "Proof: block update.k3s.io during installation"
        type: boolean
        default: false
      inject_startup_failure:
        description: "Proof only: replace the backend entrypoint with an immediate failure"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENTHUB_CHART: ./helm/open-agenthub
      SCRIPTS: https://raw.githubusercontent.com/open-agenthub/open-agenthub.github.io/main
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the quickstart and its smoke test
        env:
          INSTALLER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.installer_ref || '' }}
        run: |
          if [ -n "$INSTALLER_REF" ]; then
            curl -fsSL "https://raw.githubusercontent.com/open-agenthub/open-agenthub.github.io/$INSTALLER_REF/install.sh" -o /tmp/install.sh
          else
            curl -fsSL https://open-agenthub.github.io/install.sh -o /tmp/install.sh
          fi
          curl -fsSL "$SCRIPTS/.github/scripts/install-smoke.sh" -o /tmp/install-smoke.sh

      - uses: docker/setup-buildx-action@v4

      - name: Select checkout image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # PR builds in build-images.yml are cache-only. Load the images locally
      # rather than testing main while a PR's backend never starts.
      - name: Build backend from this checkout
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/open-agenthub/open-agenthub/backend:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-amd64

      - name: Build frontend from this checkout
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/open-agenthub/open-agenthub/frontend:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend-amd64

      - name: Build artifact-renderer from this checkout
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./artifact-renderer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/open-agenthub/open-agenthub/artifact-renderer:${{ env.IMAGE_TAG }}
          build-args: APP_VERSION=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=artifact-renderer-amd64

      - name: Build native Claude for provider replacement proof
        if: github.event_name == 'workflow_dispatch' && (inputs.prove_provider_switch || inputs.prove_provider_recovery)
        uses: docker/build-push-action@v7
        with:
          context: ./agent-runtime
          file: ./agent-runtime/claude/Dockerfile
          platforms: linux/amd64
          load: true
          tags: example.com/provider-switch-claude-base:local
          cache-from: type=gha,scope=agent-runtime-claude-amd64

      - name: Build native Codex for provider replacement proof
        if: github.event_name == 'workflow_dispatch' && (inputs.prove_provider_switch || inputs.prove_provider_recovery)
        uses: docker/build-push-action@v7
        with:
          context: ./agent-runtime
          file: ./agent-runtime/codex/Dockerfile
          platforms: linux/amd64
          load: true
          tags: example.com/provider-switch-codex-base:local
          cache-from: type=gha,scope=agent-runtime-codex-amd64

      - name: Preload checkout images for the quickstart
        env:
          INJECT_STARTUP_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_startup_failure || false }}
        run: bash tests/InstallSmokeProof/prepare-images.sh

      - name: Block k3s channel for outage proof
        if: github.event_name == 'workflow_dispatch' && inputs.block_k3s_channel
        run: |
          echo "127.0.0.1 update.k3s.io" | sudo tee -a /etc/hosts
          if curl --noproxy '*' --connect-timeout 5 -fsSL https://update.k3s.io/v1-release/channels/stable; then
            echo "Channel unexpectedly reachable" >&2
            exit 1
          fi

      - name: Install
        run: sh /tmp/install.sh

      - name: Prove bundled database first startup
        if: always() && github.event_name == 'workflow_dispatch' && inputs.prove_postgres_startup
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash tests/PostgresStartupProof/prove.sh

      - name: Verify running image identities
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash tests/InstallSmokeProof/verify-images.sh "${GITHUB_SHA:0:7}"

      - name: Smoke test
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash /tmp/install-smoke.sh default

      - name: Prove object-storage egress isolation
        if: github.event_name == 'workflow_dispatch' && inputs.prove_storage_egress
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
          RELEASE_NAMESPACE: agenthub
          SESSIONS_NAMESPACE: agenthub-sessions
        run: bash tests/ObjectStorageEgressProof/prove.sh

      - name: Prove persistent session workspace
        if: github.event_name == 'workflow_dispatch' && inputs.prove_workspace_pvc
        run: bash tests/ProviderWorkspaceProof/prove.sh

      - name: Prove real native provider replacement
        if: github.event_name == 'workflow_dispatch' && (inputs.prove_provider_switch || inputs.prove_provider_recovery)
        env:
          PROOF_RECOVERY: ${{ inputs.prove_provider_recovery && '1' || '0' }}
        run: bash tests/ProviderSwitchProof/prove.sh

      - name: Upgrade in place keeps the release healthy
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          sh /tmp/install.sh
          bash /tmp/install-smoke.sh default

      - name: Prove quickstart migration to OIDC and recovery
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash tests/OidcStartupProof/install.sh
      - name: Prepare private CA proof client SDK
        if: github.event_name == 'workflow_dispatch' && inputs.prove_backend_private_ca
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Prove private CA backend trust
        if: github.event_name == 'workflow_dispatch' && inputs.prove_backend_private_ca
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash tests/OidcStartupProof/private-ca.sh
      - name: Prove team login through quickstart ingress
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: bash tests/TeamIngressProof/prove.sh
      # A chart upgrade must move every image with the chart's appVersion (#491); the old
      # "latest" default left a release on whatever its nodes had pulled first.
      - name: Upgrade to a newer chart moves the images
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          next=$(bash tests/InstallSmokeProof/upgrade-images.sh)
          sh /tmp/install.sh
          bash tests/InstallSmokeProof/verify-images.sh "$next"
          bash /tmp/install-smoke.sh default

      - name: Diagnostics
        if: failure()
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        run: |
          kubectl -n agenthub get all,pvc,events || true
          kubectl -n agenthub get pods -o json || true
          kubectl -n agenthub logs postgres-0 --previous --timestamps || true
          sudo journalctl -k --no-pager | tail -200 || true
          for p in $(kubectl -n agenthub get pods -o name 2>/dev/null); do
            echo "::group::$p"; kubectl -n agenthub describe "$p" | tail -30
            kubectl -n agenthub logs "$p" --all-containers --tail=100 || true; echo "::endgroup::"
          done
