name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Without a database the PostgreSQL integration tests skip themselves, which quietly
      # took ~70 tests out of CI — including every store round-trip.
      #
      # Started here rather than as a service container because the suite opens a
      # connection pool per test class and blows past the default max_connections of 100
      # ("53300: sorry, too many clients already"); a service container cannot take
      # postgres command-line arguments.
      - name: Start PostgreSQL
        run: |
          docker run -d --name test-postgres \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=agenthub_test \
            -p 5432:5432 postgres:16-alpine -c max_connections=500
          for i in $(seq 1 30); do
            docker exec test-postgres pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2
          docker logs test-postgres >&2
          exit 1
      # Parallelism is capped as well: even with plenty of connections available, running
      # every Postgres-backed class at once starves them into command timeouts.
      - run: >-
          dotnet test tests/AgentHub.Api.Tests/AgentHub.Api.Tests.csproj -c Release
          -- xunit.maxParallelThreads=3
        env:
          AGENTHUB_TEST_POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Username=postgres;Password=test;Database=agenthub_test"
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f test-postgres

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/ArtifactRenderer.Tests/ArtifactRenderer.Tests.csproj -c Release
      - run: docker build --file artifact-renderer/Dockerfile --tag open-agenthub-dev/artifact-renderer:test .

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: agent-runtime/session-agent
        run: npm ci
      - working-directory: agent-runtime/session-agent
        run: npm test
      - working-directory: browser-runtime
        run: npm ci
      - working-directory: browser-runtime
        run: npm test
      - name: Build Claude runtime
        run: docker build --file agent-runtime/claude/Dockerfile --tag open-agenthub-dev/agent-runtime-claude:test agent-runtime
      - name: Smoke Claude CLI
        run: docker run --rm --entrypoint claude open-agenthub-dev/agent-runtime-claude:test --version
      - name: Build Codex runtime
        run: docker build --file agent-runtime/codex/Dockerfile --tag open-agenthub-dev/agent-runtime-codex:test agent-runtime
      - name: Smoke Codex runtime
        shell: pwsh
        run: ./agent-runtime/session-agent/test/codex-container-smoke.ps1 -Image open-agenthub-dev/agent-runtime-codex:test
      - name: Build Cursor runtime
        run: docker build --file agent-runtime/cursor/Dockerfile --tag open-agenthub-dev/agent-runtime-cursor:test agent-runtime
      - name: Smoke Cursor CLI
        run: docker run --rm --entrypoint agent open-agenthub-dev/agent-runtime-cursor:test --version
      - name: Build OpenClaw runtime
        run: docker build --file agent-runtime/openclaw/Dockerfile --tag open-agenthub-dev/agent-runtime-openclaw:test agent-runtime
      - name: Smoke OpenClaw CLI
        run: docker run --rm --entrypoint openclaw open-agenthub-dev/agent-runtime-openclaw:test --version

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint development chart
        run: helm lint helm/open-agenthub --values helm/open-agenthub/values-dev.yaml --set-string postgres.password=test-only
      - name: Verify rendered runtime images
        shell: pwsh
        run: ./tests/helm/codex-runtime-values.ps1
      - name: Verify Cursor runtime images
        shell: pwsh
        run: ./tests/helm/cursor-runtime-values.ps1
      - name: Verify OpenClaw runtime images
        shell: pwsh
        run: ./tests/helm/openclaw-runtime-values.ps1
      - name: Verify browser values and RBAC
        shell: pwsh
        run: ./tests/helm/browser-values.ps1
      - name: Verify session file and renderer values
        shell: pwsh
        run: ./tests/helm/files-values.ps1
      - name: Verify deployment parity
        shell: pwsh
        run: ./tests/helm/deployment-parity.ps1
