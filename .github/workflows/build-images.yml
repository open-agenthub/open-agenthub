name: Build container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: agent-runtime-claude
            context: ./agent-runtime
            dockerfile: ./agent-runtime/claude/Dockerfile
          - component: artifact-renderer
            context: .
            dockerfile: ./artifact-renderer/Dockerfile
          - component: agent-runtime-codex
            context: ./agent-runtime
            dockerfile: ./agent-runtime/codex/Dockerfile
          - component: agent-runtime-cursor
            context: ./agent-runtime
            dockerfile: ./agent-runtime/cursor/Dockerfile
          - component: agent-runtime-openclaw
            context: ./agent-runtime
            dockerfile: ./agent-runtime/openclaw/Dockerfile
          - component: browser
            context: ./browser-runtime
            dockerfile: ./browser-runtime/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          # The backend needs the repository root for ee/ sources. Agent provider
          # runtimes share agent-runtime as their build context.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      # Reports OS and language vulnerabilities into the repo's Security tab. Deliberately
      # non-blocking: base images almost always carry some unfixed CVE, and a gate here
      # would stop unrelated deploys. Set exit-code to 1 to make it a gate.
      - name: Scan the image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload the scan result
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
