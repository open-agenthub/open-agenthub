name: Build container images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # Every image is built natively per architecture — amd64 on the x64 runner, arm64 on
  # the arm runner (Apple Silicon via k3d, Graviton, Raspberry Pi) — instead of under
  # QEMU, which makes the .NET and node-pty builds unbearably slow. Each build pushes by
  # digest only; the merge job below combines both into one multi-arch tag.
  build:
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-latest }
          - { name: arm64, runner: ubuntu-24.04-arm }
        component:
          - name: backend
            context: .
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: agent-runtime-claude
            context: ./agent-runtime
            dockerfile: ./agent-runtime/claude/Dockerfile
          - name: artifact-renderer
            context: .
            dockerfile: ./artifact-renderer/Dockerfile
          - name: agent-runtime-codex
            context: ./agent-runtime
            dockerfile: ./agent-runtime/codex/Dockerfile
          - name: agent-runtime-cursor
            context: ./agent-runtime
            dockerfile: ./agent-runtime/cursor/Dockerfile
          - name: agent-runtime-openclaw
            context: ./agent-runtime
            dockerfile: ./agent-runtime/openclaw/Dockerfile
          - name: browser
            context: ./browser-runtime
            dockerfile: ./browser-runtime/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component.name }}

      # The version the backend and frontend images report in the UI. A release tag gives
      # its semver; everything else gets the 7-character commit, which is also the image tag
      # the merge job publishes (type=sha below), so the footer names a pullable image.
      - name: Determine the application version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          # The backend needs the repository root for ee/ sources. Agent provider
          # runtimes share agent-runtime as their build context.
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/${{ matrix.arch.name }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, github.repository, matrix.component.name) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }}-${{ matrix.arch.name }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component.name }}-${{ matrix.arch.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
          - agent-runtime-claude
          - artifact-renderer
          - agent-runtime-codex
          - agent-runtime-cursor
          - agent-runtime-openclaw
          - browser
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.component }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create the multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" -eq 2 || { echo "::error::expected an amd64 and an arm64 digest"; ls; exit 1; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Reports OS and language vulnerabilities into the repo's Security tab. Deliberately
      # non-blocking: base images almost always carry some unfixed CVE, and a gate here
      # would stop unrelated deploys. Set exit-code to 1 to make it a gate.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 0

      - name: Upload the scan result
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}
