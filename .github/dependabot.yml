version: 2

# Keeps dependencies current. The agent CLIs pinned in agent-runtime/*/Dockerfile are
# not covered here — Dependabot cannot read them — see update-agent-runtimes.yml.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /agent-runtime/session-agent
      - /browser-runtime
      - /mcp/agenthub
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images (node:22-bookworm-slim, the .NET SDK/runtime images, …). Grouped so a
  # base-image bump arrives as one reviewable PR instead of one per Dockerfile — the
  # runtimes must move together anyway, since image.tag selects all of them at once.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /artifact-renderer
      - /browser-runtime
      - /agent-runtime/claude
      - /agent-runtime/codex
      - /agent-runtime/cursor
      - /agent-runtime/openclaw
      - /agent-runtime/opencode
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
