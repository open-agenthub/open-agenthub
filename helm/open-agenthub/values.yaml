# Namespace where the agent session pods run.
# The release itself is installed into the control-plane namespace (e.g. "agenthub").
sessionsNamespace: agenthub-sessions
# Create the sessions namespace (incl. PSA labels) as part of the release.
# Set to false if the namespace is managed outside of Helm.
createSessionsNamespace: true

# Soft limit on concurrent non-terminal sessions per owner
# (Pending | Running | Paused | Scheduled). Exceeding returns 429 on create.
maxRunningSessionsPerOwner: 20
# Inject in-pod agenthub_sessions MCP and enable internal spawn endpoints.
spawnMcpEnabled: true

image:
  # Base path; component images use {registry}/{component}:{tag}. The agent runtime
  # names are agent-runtime-claude, agent-runtime-codex, agent-runtime-cursor,
  # agent-runtime-openclaw, and agent-runtime-opencode unless overridden below.
  registry: ghcr.io/open-agenthub/open-agenthub
  tag: latest
  pullPolicy: IfNotPresent
  # Name of an existing dockerconfigjson secret (empty = none). Must exist in the release
  # namespace AND in the sessionsNamespace (agent pods use it to pull the agent-runtime image).
  pullSecret: ""

# Remote MCP server at <host>/mcp, so AI clients can drive sessions on behalf of a signed-in
# user. Guarded by an OAuth 2.1 authorization server this instance runs itself, which federates
# the login to the configured OIDC provider (or, on an instance without one, attributes
# everything to the local "dev" user like the rest of the API does).
#
# Off by default: enabling it exposes an authorization server and a dynamic client registration
# endpoint, which should be a deliberate choice rather than something a chart upgrade turns on.
mcp:
  enabled: false
  # Externally reachable HTTPS origin, no trailing slash. Empty derives it from ingress.host.
  publicUrl: ""

ingress:
  enabled: true
  host: agenthub.example.com
  className: nginx
  # cert-manager ClusterIssuer for the TLS certificate (empty = omit the annotation).
  clusterIssuer: ""
  tlsSecretName: agenthub-tls
  # Additional controller annotations. Entries override the safe defaults below.
  annotations: {}
  bodySize: 55m

backend:
  replicas: 2
  environment: Production
  developmentAuth:
    enabled: false
    headerName: X-AgentHub-Test-User
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

frontend:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Override for a local browser origin when ingress is disabled.
frontendOrigin: ""

agent:
  port: 7681
  gitCloneImage: alpine/git:2.45.2
  # Optional full image references. Empty values preserve image.registry/image.tag
  # compatibility and select agent-runtime-claude / agent-runtime-codex /
  # agent-runtime-cursor / agent-runtime-openclaw / agent-runtime-opencode respectively.
  images:
    claude: ""
    codex: ""
    cursor: ""
    openclaw: ""
    opencode: ""
  # Pull policy for agent runtime images in session pods. Use "Always" when
  # the image tag moves (e.g. :latest) so nodes don't serve a stale cache.
  pullPolicy: IfNotPresent
  runtimeClassName: ""
  maxCpu: "2"
  maxMemory: 4Gi
  # Users may specify a custom container image per session.
  allowCustomImage: true
  # Users may run sessions as root (tools can be installed).
  # Requires PSA "baseline" (instead of "restricted") on the sessionsNamespace.
  allowRootSessions: true
  # Extra TCP egress ports allowed from session pods (besides 53/80/443/22),
  # e.g. [3900] for self-hosted object storage on a non-standard port.
  extraEgressPorts: []
  # Runtime port requests: an agent may ask (via the built-in agenthub_network MCP
  # server) to open additional ports while the session runs — egress (e.g. Postgres
  # 5432) or browser→agent (a dev server beyond the default preview ports). The
  # session owner approves each request; approved ports become per-session
  # NetworkPolicies that are deleted with the session. Only ports listed here can be
  # requested — anything else is rejected without asking. Entries are single ports
  # or "from-to" ranges; [] disallows requests entirely.
  #
  # Keep these in step with NetworkPortOptions.RequestablePorts, which documents what each
  # range is for. Being listed is permission to ask, not access — the owner still approves
  # every request — so the defaults are generous enough that a framework's own dev server
  # and the usual backing services can be asked for. A port that is missing is refused
  # before the owner sees it, which an agent reads as the platform being unable to do it.
  portRequests:
    enabled: true
    requestablePorts:
      - "3000-3010"   # React, Next.js, Nuxt, Node
      - "3306"        # MariaDB / MySQL
      - "3900"        # Garage S3 API
      - "4173"        # Vite preview
      - "4200-4210"   # Angular
      - "5000-5300"   # ASP.NET Core http, Flask, Vite dev (5173)
      - "5432"        # PostgreSQL
      - "6379"        # Redis
      - "6443"        # Kubernetes API — session pods mount no service account token
      - "7000-7300"   # ASP.NET Core https
      - "8000-8010"   # Django, FastAPI, Laravel, PHP built-in server
      - "8080-8090"   # generic http
      - "9000-9100"   # MinIO, php-fpm
      - "27017"       # MongoDB

files:
  maxImageBytes: 20971520
  maxDocumentBytes: 52428800
  maxMessageBytes: 52428800
  maxMessageFiles: 5
  maxSessionFiles: 200
  maxSessionBytes: 1073741824
  presignMinutes: 10
  reservationMinutes: 15
  sweepSeconds: 60
  presentationPollMilliseconds: 1500
  officePreview:
    enabled: false
    replicas: 1
    baseUrl: http://agenthub-artifact-renderer:8080/
    timeoutSeconds: 90
    maxOutputBytes: 52428800
    pollMilliseconds: 1000
    temporaryStorage: 256Mi
    image:
      repository: ghcr.io/open-agenthub/open-agenthub/artifact-renderer
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

browser:
  enabled: true
  image:
    repository: ghcr.io/open-agenthub/open-agenthub/browser
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  screen: 2560x1600
  startupTimeoutSeconds: 90
  cookieCheckpointSeconds: 60
  cookieStateMaxBytes: 1048576
  extraEgressPorts: []
  # Ports on the session's own pod that the browser may open, so an agent can serve a page
  # it is building and look at it (`browser_navigate` to http://$AGENTHUB_POD_IP:<port>).
  # The defaults cover the usual dev servers; set [] to disallow it entirely.
  previewPorts: [3000, 4173, 5173, 8000, 8080]

# Kubernetes Secret data is base64-encoded, not automatically encrypted at rest.
# Production clusters should enable API-server encryption at rest (preferably KMS),
# restrict RBAC and network access, and rotate credentials regularly.

# OAuth2/OIDC provider. Empty authority = auth disabled (dev mode, all requests as user "dev").
oidc:
  authority: ""
  # Expected "aud" claim of access tokens. Empty = skip audience validation
  # (e.g. Keycloak without an audience mapper on the client).
  audience: agenthub
  clientId: agenthub
  scope: openid profile email
  requireHttpsMetadata: true

# Skill library: agents get a built-in "skill-library" MCP server in every
# session to search, upload and version skills (per project or personal).
skillLibrary:
  mcp: true
  # Optional semantic (vector) search via an OpenAI-compatible /embeddings
  # endpoint (OpenAI, Voyage, Ollama, LocalAI, ...). Empty = keyword search only.
  embeddings:
    endpoint: ""
    model: ""
    apiKey: ""

# S3-compatible object storage for session state, scrollback, and artifacts.
# Empty serviceUrl = AWS endpoints. Any S3-compatible server works; Garage and SeaweedFS are
# both small enough for a single-node cluster.
s3:
  # Where the backend reaches object storage. Usually a cluster-internal address.
  serviceUrl: ""
  # Where a *browser* reaches the same storage, if it can at all — e.g. an ingress in
  # front of it. Leave empty (the default) and file uploads and downloads are streamed
  # through the API instead, which is the only thing that works with an internal endpoint.
  # Setting it hands out presigned URLs again and keeps the traffic off the backend.
  publicUrl: ""
  region: us-east-1
  bucket: agenthub
  accessKey: ""
  secretKey: ""
  # Skip TLS certificate validation — only for an internal endpoint with a self-signed cert.
  insecureTls: false

# Roll out that object storage inside the cluster (Garage) instead of pointing s3.* at an
# external provider. The setup scripts offer this; they generate the credentials and run the
# one-time bootstrap (layout, bucket, key) that Garage needs afterwards.
#
# When enabled, s3.serviceUrl, s3.accessKey and s3.secretKey default to this instance, so
# nothing else has to be configured. Setting any of them explicitly still wins — that is how
# you point an existing deployment at something else without tearing this down first.
objectStorage:
  enabled: false
  image: dxflrs/garage:v1.0.1
  persistence: true
  # Empty = the cluster's default StorageClass.
  storageClass: ""
  metaStorage: 2Gi
  dataStorage: 20Gi
  # What the node reports as usable. Garage's own notation — the suffixes it accepts are
  # B, KB, MB, GB, TB and PB. Deliberately under dataStorage: Garage refuses writes once a
  # node is full, and the metadata it writes alongside the data has to fit as well.
  capacity: 18GB
  # Credentials the hub signs with. Garage imports exactly these rather than generating its
  # own, so the chart and the store agree without reading anything back out of the cluster.
  # Access key IDs must look like Garage's own: "GK" plus 24 hex characters.
  accessKey: ""
  secretKey: ""
  # Node-to-node RPC secret (32 bytes, hex) and admin API token. Garage will not start
  # without the RPC secret even as a single node.
  rpcSecret: ""
  adminToken: ""
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }

n8n:
  webhookUrl: ""

# Community chat integrations: session updates + replies via Telegram and/or Signal.
# Docs: see README "Chat integrations". Both default off.
# NOTE: either integration requires backend.replicas=1 — Telegram getUpdates and the
# Signal receive socket allow only ONE consumer. The chart refuses to render otherwise.
chat:
  telegram:
    enabled: false
    botToken: ""      # from @BotFather
  signal:
    enabled: false
    number: ""        # registered sender number, e.g. "+15551234567"
    # Pinned version on purpose: the Signal account state (registration/keys) lives
    # on the PVC — check the signal-cli-rest-api release notes for data/API migration
    # steps before bumping this tag.
    image: bbernhard/signal-cli-rest-api:0.94
    storage: 1Gi      # PVC for the number registration/keys

# Token/cost usage dashboard via OpenTelemetry. When enabled, session pods export
# Claude Code's token/cost metrics (OTLP/HTTP protobuf) to the internal backend service,
# which aggregates them per session/owner for the "Usage" view. Agent->backend egress is
# already permitted by the networkpolicy, so no extra egress rule is needed.
telemetry:
  enabled: true
  # Optional OTLP endpoint base override (the exporter appends "/v1/metrics").
  # Empty = the internal backend service (http://agenthub-backend.<ns>.svc.cluster.local/internal/otel).
  otlpEndpoint: ""

# Enterprise license (offline-verified). Enterprise features (ee/) only run with a
# valid token. Neither the token nor the verification key are chart values: the token
# is activated in the app's Admin area (stored in the DB), and the public key used to
# verify it is compiled into the binary (EnterpriseLicense.PublicKeyPem). This way
# enterprise features can't be unlocked by flipping a Helm flag or swapping the key.

# Enterprise features (require a valid license).
ee:
  # Comma-separated list of admin usernames (preferred_username). Empty = every
  # signed-in user is an admin (bootstrap; lock this down for real deployments).
  admins: ""
  # Optional link to the billing portal (Stripe customer portal via the license service),
  # surfaced in the Admin area for subscription/invoice management.
  billingPortalUrl: ""
  # License service the instance reports its seat count to (heartbeat). Reporting renews
  # the license token; the reported month-close count drives Stripe seat billing. Empty
  # disables reporting. See the privacy policy — only an aggregate user count is sent.
  # Whatever URL is configured, tokens are only accepted if signed by the official
  # service key — the verifying public key is compiled into the backend binary.
  license:
    serviceUrl: "https://license.instances.open-agenthub.on-mb.com"
    reportIntervalHours: 24
  # Slack integration: asks you in a Slack thread whenever a session waits for input,
  # and turns your thread replies into the agent's answer. Uses Socket Mode.
  slack:
    enabled: false
    channel: ""       # target channel id (e.g. C0123ABCD)
    botToken: ""      # xoxb-… (chat.postMessage)
    appToken: ""      # xapp-… (Socket Mode)

# Git OAuth: lets users connect GitHub/GitLab accounts ("Connect" on the Account page)
# so sessions clone/push their repos without a manual PAT. Optional — leave providers
# empty to keep only the manual credentials flow.
git:
  # HMAC key that signs the OAuth "state" parameter. Set a random 32+ char string
  # (must be stable across replicas/restarts). Generated by the quickstart installer.
  stateKey: ""
  # One entry per provider. Register an OAuth app at the provider with the callback URL
  # https://<ingress.host>/api/git/callback/<id>. `baseUrl` enables self-hosted instances.
  # Scopes default to "repo read:user" (GitHub) / "api read_user" (GitLab).
  providers: []
  #  - id: github
  #    type: github            # github | gitlab
  #    displayName: GitHub
  #    baseUrl: ""             # e.g. https://github.example.com for GitHub Enterprise
  #    clientId: ""
  #    clientSecret: ""
  #    scopes: ""

# Dev Postgres inside the cluster. For prod: set enabled=false and externalDatabase.connectionString.
postgres:
  enabled: true
  image: postgres:16-alpine
  # false = emptyDir instead of a PVC (data is lost on pod restart). Only for testing,
  # when no storage provisioner is available.
  persistence: true
  storage: 5Gi
  storageClass: ""
  # Required when enabled=true; written to the secret and embedded in the connection string.
  password: ""

externalDatabase:
  # Only relevant when postgres.enabled=false, e.g. "Host=...;Database=...;Username=...;Password=..."
  connectionString: ""
