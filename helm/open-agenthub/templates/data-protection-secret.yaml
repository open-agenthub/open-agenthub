{{- if not .Values.dataProtection.existingSecret }}
{{- /* Keep the wrapping identity across upgrades and uninstall/reinstall. A new certificate
       cannot read the database's existing ring, even if every replica gets the same new one. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "agenthub-data-protection" }}
{{- $cert := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- $cert = required "existing data-protection Secret is missing tls.crt" (index $existing.data "tls.crt") | b64dec }}
{{- $key = required "existing data-protection Secret is missing tls.key" (index $existing.data "tls.key") | b64dec }}
{{- else }}
{{- $generated := genSelfSignedCert "agenthub-data-protection" nil nil 36500 }}
{{- $cert = $generated.Cert }}
{{- $key = $generated.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: agenthub-data-protection
  labels: {{ include "agenthub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
stringData:
  tls.crt: {{ $cert | quote }}
  tls.key: {{ $key | quote }}
{{- end }}
