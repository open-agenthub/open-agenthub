{{- if .Values.ingress.enabled }}
{{- $annotations := dict
      "nginx.ingress.kubernetes.io/proxy-body-size" (.Values.ingress.bodySize | default "55m")
      "nginx.ingress.kubernetes.io/proxy-read-timeout" "3600"
      "nginx.ingress.kubernetes.io/proxy-send-timeout" "3600" -}}
{{- $annotations = mergeOverwrite $annotations (.Values.ingress.annotations | default dict) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agenthub
  labels: {{ include "agenthub.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    {{- range $key, $value := $annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API + WebSocket to the backend; /internal is deliberately NOT routed
          - path: /api
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          {{- if .Values.mcp.enabled }}
          # Remote MCP endpoint and its OAuth server. These live outside /api because the
          # paths are fixed by the specs MCP clients discover them with: the resource
          # identifier is <origin>/mcp (RFC 8707), and the metadata documents must sit under
          # /.well-known (RFC 9728). Routed to the backend explicitly — otherwise they fall
          # through to the SPA below, which answers every discovery request with index.html
          # and every POST with 405.
          - path: /mcp
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          - path: /connect
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          - path: /.well-known/openid-configuration
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          # The discovery document advertises this as jwks_uri; unrouted it serves the SPA and a
          # client trying to validate a token finds no keys. Listed individually rather than
          # routing all of /.well-known, which would also swallow cert-manager's
          # acme-challenge path.
          - path: /.well-known/jwks
            pathType: Prefix
            backend:
              service: { name: agenthub-backend, port: { number: 80 } }
          {{- end }}
          # Everything else: SPA
          - path: /
            pathType: Prefix
            backend:
              service: { name: agenthub-frontend, port: { number: 80 } }
{{- end }}
