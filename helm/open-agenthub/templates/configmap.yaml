{{- $browserScreen := splitList "x" .Values.browser.screen -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agenthub-config
  labels: {{ include "agenthub.labels" . | nindent 4 }}
data:
  Kestrel__Limits__MaxRequestBodySize: "57671680"
  ASPNETCORE_ENVIRONMENT: {{ .Values.backend.environment | default "Production" | quote }}
  DevelopmentAuth__Enabled: {{ .Values.backend.developmentAuth.enabled | default false | quote }}
  DevelopmentAuth__HeaderName: {{ .Values.backend.developmentAuth.headerName | default "X-AgentHub-Test-User" | quote }}
  AgentHub__Namespace: {{ .Values.sessionsNamespace | quote }}
  AgentHub__ControlNamespace: {{ .Release.Namespace | quote }}
  # Legacy Claude-only option retained for backend/chart rollback compatibility.
  AgentHub__AgentImage: {{ include "agenthub.agentImage" . | quote }}
  AgentHub__ClaudeAgentImage: {{ include "agenthub.claudeAgentImage" . | quote }}
  AgentHub__CodexAgentImage: {{ include "agenthub.codexAgentImage" . | quote }}
  AgentHub__CursorAgentImage: {{ include "agenthub.cursorAgentImage" . | quote }}
  AgentHub__OpenClawAgentImage: {{ include "agenthub.openclawAgentImage" . | quote }}
  AgentHub__AgentPort: {{ .Values.agent.port | quote }}
  AgentHub__GitCloneImage: {{ .Values.agent.gitCloneImage | quote }}
  AgentHub__AgentImagePullPolicy: {{ .Values.agent.pullPolicy | default "IfNotPresent" | quote }}
  AgentHub__ImagePullSecret: {{ .Values.image.pullSecret | quote }}
  AgentHub__RuntimeClassName: {{ .Values.agent.runtimeClassName | quote }}
  AgentHub__MaxCpu: {{ .Values.agent.maxCpu | quote }}
  AgentHub__MaxMemory: {{ .Values.agent.maxMemory | quote }}
  AgentHub__AllowCustomImage: {{ .Values.agent.allowCustomImage | quote }}
  AgentHub__AllowRootSessions: {{ .Values.agent.allowRootSessions | quote }}
  AgentHub__CallbackBaseUrl: "http://agenthub-backend.{{ .Release.Namespace }}.svc.cluster.local"
  AgentHub__TelemetryEnabled: {{ .Values.telemetry.enabled | default false | quote }}
  AgentHub__TelemetryOtlpEndpoint: {{ .Values.telemetry.otlpEndpoint | default "" | quote }}
  AgentHub__MaxRunningSessionsPerOwner: {{ .Values.maxRunningSessionsPerOwner | default 20 | quote }}
  AgentHub__SpawnMcpEnabled: {{ .Values.spawnMcpEnabled | quote }}
  Files__MaxImageBytes: {{ .Values.files.maxImageBytes | int64 | quote }}
  Files__MaxDocumentBytes: {{ .Values.files.maxDocumentBytes | int64 | quote }}
  Files__MaxMessageBytes: {{ .Values.files.maxMessageBytes | int64 | quote }}
  Files__MaxMessageFiles: {{ .Values.files.maxMessageFiles | quote }}
  Files__MaxSessionFiles: {{ .Values.files.maxSessionFiles | quote }}
  Files__MaxSessionBytes: {{ .Values.files.maxSessionBytes | int64 | quote }}
  Files__PresignMinutes: {{ .Values.files.presignMinutes | quote }}
  Files__ReservationMinutes: {{ .Values.files.reservationMinutes | quote }}
  Files__SweepSeconds: {{ .Values.files.sweepSeconds | quote }}
  Files__PresentationPollMilliseconds: {{ .Values.files.presentationPollMilliseconds | quote }}
  Files__OfficePreview__Enabled: {{ .Values.files.officePreview.enabled | quote }}
  Files__OfficePreview__BaseUrl: {{ .Values.files.officePreview.baseUrl | quote }}
  Files__OfficePreview__TimeoutSeconds: {{ .Values.files.officePreview.timeoutSeconds | quote }}
  Files__OfficePreview__MaxOutputBytes: {{ .Values.files.officePreview.maxOutputBytes | int64 | quote }}
  Files__OfficePreview__PollMilliseconds: {{ .Values.files.officePreview.pollMilliseconds | quote }}
  Browser__Enabled: {{ .Values.browser.enabled | quote }}
  {{ if .Values.browser.enabled }}
  Browser__Image: {{ include "agenthub.browserImage" . | quote }}
  Browser__PullPolicy: {{ .Values.browser.image.pullPolicy | quote }}
  Browser__ImagePullSecret: {{ .Values.image.pullSecret | quote }}
  Browser__RuntimeClassName: {{ .Values.agent.runtimeClassName | quote }}
  Browser__CpuRequest: {{ .Values.browser.resources.requests.cpu | quote }}
  Browser__MemoryRequest: {{ .Values.browser.resources.requests.memory | quote }}
  Browser__CpuLimit: {{ .Values.browser.resources.limits.cpu | quote }}
  Browser__MemoryLimit: {{ .Values.browser.resources.limits.memory | quote }}
  Browser__ScreenWidth: {{ index $browserScreen 0 | quote }}
  Browser__ScreenHeight: {{ index $browserScreen 1 | quote }}
  Browser__StartupTimeoutSeconds: {{ .Values.browser.startupTimeoutSeconds | quote }}
  Browser__CookieCheckpointSeconds: {{ .Values.browser.cookieCheckpointSeconds | quote }}
  Browser__CookieStateMaxBytes: {{ .Values.browser.cookieStateMaxBytes | int64 | quote }}
  {{ range $i, $port := .Values.browser.extraEgressPorts }}
  Browser__ExtraEgressPorts__{{ $i }}: {{ $port | quote }}
  {{ end }}
  {{ end }}
  S3__ServiceUrl: {{ .Values.s3.serviceUrl | quote }}
  S3__Region: {{ .Values.s3.region | quote }}
  S3__Bucket: {{ .Values.s3.bucket | quote }}
  S3__InsecureTls: {{ .Values.s3.insecureTls | default false | quote }}
  N8n__WebhookUrl: {{ .Values.n8n.webhookUrl | quote }}
  Oidc__Authority: {{ .Values.oidc.authority | quote }}
  Oidc__Audience: {{ .Values.oidc.audience | quote }}
  Oidc__ClientId: {{ .Values.oidc.clientId | quote }}
  Oidc__Scope: {{ .Values.oidc.scope | quote }}
  Oidc__RequireHttpsMetadata: {{ .Values.oidc.requireHttpsMetadata | quote }}
  FrontendOrigin: {{ .Values.frontendOrigin | default (printf "https://%s" .Values.ingress.host) | quote }}
  Ee__Admins: {{ .Values.ee.admins | default "" | quote }}
  Ee__BillingPortalUrl: {{ .Values.ee.billingPortalUrl | default "" | quote }}
  Ee__License__ServiceUrl: {{ .Values.ee.license.serviceUrl | default "" | quote }}
  Ee__License__ReportIntervalHours: {{ .Values.ee.license.reportIntervalHours | default 24 | quote }}
  Ee__Slack__Enabled: {{ .Values.ee.slack.enabled | quote }}
  Ee__Slack__Channel: {{ .Values.ee.slack.channel | quote }}
  Chat__Telegram__Enabled: {{ .Values.chat.telegram.enabled | quote }}
  Chat__Signal__Enabled: {{ .Values.chat.signal.enabled | quote }}
  {{- if .Values.chat.signal.enabled }}
  Chat__Signal__Number: {{ .Values.chat.signal.number | quote }}
  Chat__Signal__ApiUrl: "http://agenthub-signal-cli.{{ .Release.Namespace }}.svc.cluster.local:8080"
  {{- end }}
  {{- range $i, $p := .Values.git.providers }}
  Git__Providers__{{ $i }}__Id: {{ $p.id | quote }}
  Git__Providers__{{ $i }}__Type: {{ $p.type | quote }}
  Git__Providers__{{ $i }}__DisplayName: {{ $p.displayName | default $p.id | quote }}
  Git__Providers__{{ $i }}__BaseUrl: {{ $p.baseUrl | default "" | quote }}
  Git__Providers__{{ $i }}__ClientId: {{ $p.clientId | quote }}
  Git__Providers__{{ $i }}__Scopes: {{ $p.scopes | default "" | quote }}
  {{- end }}
