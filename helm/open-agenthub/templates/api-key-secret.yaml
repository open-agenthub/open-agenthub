{{- if and (eq (include "agenthub.authMode" .) "apiKey") (not (include "agenthub.apiKeyExistingSecret" .)) }}
{{- /* Generated once and then read back: re-rolling it on every upgrade would sign the owner out
       and break every script that holds the key. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "agenthub-api-key" }}
{{- $key := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "api-key") }}
{{- $key = index $existing.data "api-key" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: agenthub-api-key
  labels: {{ include "agenthub.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $key | quote }}
  owner: {{ include "agenthub.apiKeyOwner" . | quote }}
{{- end }}
