# ServiceAccount of the backend (control plane)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub-backend
  labels: {{ include "agenthub.labels" . | nindent 4 }}
---
# ServiceAccount of the agent pods – deliberately WITHOUT any permissions (the token is not mounted anyway)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenthub-agent
  namespace: {{ .Values.sessionsNamespace }}
  labels: {{ include "agenthub.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The backend may manage ONLY the required objects, and ONLY in the session namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenthub-session-manager
  namespace: {{ .Values.sessionsNamespace }}
  labels: {{ include "agenthub.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  {{ if or .Values.browser.enabled .Values.agent.portRequests.enabled }}
  # Per-session network policies come from two features now: the browser (CDP in/out) and
  # approved runtime port requests. Gating this on browser.enabled alone left an instance with
  # only port requests unable to manage them at all.
  #
  # deletecollection is required, not optional: session teardown removes a session's policies
  # by label selector in one call. Without it, deleting a session fails with a 403 from the API
  # server — the pod goes away and the record does not, and the error surfaces as a generic
  # failure rather than a permissions problem.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  {{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenthub-backend-binding
  namespace: {{ .Values.sessionsNamespace }}
  labels: {{ include "agenthub.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agenthub-session-manager
subjects:
  - kind: ServiceAccount
    name: agenthub-backend
    namespace: {{ .Release.Namespace }}
