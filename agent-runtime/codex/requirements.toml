# Session pods cannot replace the image-owned CLI; the hidden update popup would consume
# the next Workspace message as confirmation and terminate the session. Requirements override
# user, project and command-line configuration, including an explicit request to re-enable it.
check_for_update_on_startup = false

allow_managed_hooks_only = true

[features]
hooks = true

[hooks]
managed_dir = "/opt/session-agent/codex"

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node /opt/session-agent/codex/policy-hook.js"
# Full-access exec resolves backend approvals here because no PermissionRequest is raised.
timeout = 250
statusMessage = "Checking session policy"

[[hooks.PermissionRequest]]
matcher = "*"

[[hooks.PermissionRequest.hooks]]
type = "command"
command = "node /opt/session-agent/codex/policy-hook.js"
timeout = 250
statusMessage = "Waiting for session approval"

# Records that the turn changed something, so the reminder below stays off a turn that only
# answered a question.
[[hooks.PostToolUse]]
matcher = "*"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "node /opt/session-agent/codex/skill-reminder-hook.js --mark work"
timeout = 10

# Asks at the end of a turn that did real work whether anything in it belongs in the skill
# library. Codex ignores a matcher on Stop, and stop_hook_active keeps it from firing on the
# continuation it caused.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "node /opt/session-agent/codex/skill-reminder-hook.js"
timeout = 10
statusMessage = "Checking for reusable knowledge"

# Tells the chat relays (Slack/Telegram/Signal) that an interactive turn ended and the agent
# waits — the event that opens the session's thread. The hook itself stays silent in exec
# mode, where the end of the turn is the end of the process and "finished" follows.
[[hooks.Stop.hooks]]
type = "command"
command = "node /opt/session-agent/codex/turn-notify-hook.js"
timeout = 10
